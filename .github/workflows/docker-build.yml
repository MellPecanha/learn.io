name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build and Push Docker Image
      run: |
        docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
        docker build -t $DOCKER_USERNAME/learn.io:latest \
          --build-arg DATABASE_USER="$DATABASE_USER" \
          --build-arg DATABASE_HOST="$DATABASE_HOST" \
          --build-arg DATABASE_NAME="$DATABASE_NAME" \
          --build-arg DATABASE_PASSWORD="$DATABASE_PASSWORD" \
          --build-arg DATABASE_PORT="$DATABASE_PORT" \
          --build-arg JWT_SECRET="$JWT_SECRET" .
        docker push $DOCKER_USERNAME/learn.io:latest
